on: [push, pull_request]

name: Build

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v1
      - name: Setup Nuget.exe
        uses: nuget/setup-nuget@v1
      - name: Restore packages
        shell: pwsh
        run: |
          nuget restore ysoserial.sln -PackagesDirectory packages -NonInteractive -Verbosity detailed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      
          if (!(Test-Path "packages\NDesk.Options.0.2.1\lib\NDesk.Options.dll")) {
            throw "NuGet dependencies were not restored correctly"
          }
      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v1.1
      - name: Build with MSBuild
        run: msbuild ysoserial.sln -p:Configuration=Release
      - name: Prepare build artifact for stashing
        run: |
          mkdir release
          move D:\a\ysoserial.net\ysoserial.net\ysoserial\bin\Release .\release
      - name: Upload artifact
        uses: actions/upload-artifact@v4.0.0
        with:
          name: ysoserial-${{ github.sha }}
          path: .\release
